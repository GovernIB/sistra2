<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="#{sessionBean.lang}"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
  	xmlns:ui="http://java.sun.com/jsf/facelets"
  	xmlns:c="http://java.sun.com/jsp/jstl/core"
  	xmlns:p="http://primefaces.org/ui">

<f:view locale="#{sessionBean.locale}" encoding="UTF-8" contentType="text/html">


<h:head>

  <title><h:outputText value = "#{sessionBean.literalTituloPantalla}" /></title>

  <f:facet name="first">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  </f:facet>

  <h:outputScript library="js" name="common.js" target="head" />

</h:head>

<h:body styleClass="body-color" style="position:relative;">

  <f:facet name="last">
    <h:outputStylesheet library="css" name="style.css" />
      <h:outputStylesheet library="webjars" name="font-awesome/5.9.0/css/solid.min-jsf.css" />
      <h:outputStylesheet library="webjars" name="font-awesome/5.9.0/css/fontawesome.min-jsf.css" />
      <h:outputStylesheet library="webjars" name="font-awesome/5.9.0/css/v4-shims.min-jsf.css" />
  </f:facet>

    <div id="mainLayout" class="d-flex flex-column h-100">
        <div id="work" class="flex-grow-1 margin-top-10" style="overflow: auto;">
            <h2>#{msg[sessionBean.literalTituloPantalla]}</h2>
            <ui:insert name="content" />
        </div>
    </div>

    <!-- Para que elementos con global=true mostraran icono cargando (commandbutton, events, ...) -->
  <p:ajaxStatus id="startAjax" onstart="PF('loading').show();" oncomplete="PF('loading').hide();"  />


  <!-- Inclusion popups genericos -->
  <h:form id="formPopUps">
    <ui:include src="../common/popups.xhtml" />
  </h:form>

</h:body>

</f:view>

</html>
