<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html lang="#{sessionBean.lang}"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
  	xmlns:ui="http://java.sun.com/jsf/facelets"
  	xmlns:p="http://primefaces.org/ui"
  	xmlns:of="http://omnifaces.org/ui">

<f:view locale="#{sessionBean.locale}" encoding="UTF-8" contentType="text/html">


<h:head>

  <title><h:outputText value = "#{msg['aplicacion.titulo']} (#{frontModuleConfig.entornoUpper})" /></title>

  <f:facet name="first">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  </f:facet>

  <h:outputScript library="js" name="common.js" target="head" />

  <ui:insert name="icerick" />



    <f:facet name="customheader">
        <h:outputStylesheet library="css" name="style.css" />
        <h:outputStylesheet library="webjars" name="font-awesome/5.9.0/css/solid.min-jsf.css" />
        <h:outputStylesheet library="webjars" name="font-awesome/5.9.0/css/fontawesome.min-jsf.css" />
        <h:outputStylesheet library="webjars" name="font-awesome/5.9.0/css/v4-shims.min-jsf.css" />
    </f:facet>

</h:head>

<script>
	function fnAspect() {
		jQuery("input[name=hiddenWidth]").val(window.innerWidth);
		jQuery("input[name=hiddenHeight]").val(window.innerHeight);
		document.getElementById("formAspect:btnAspect").click();

	}
	jQuery(document).ready(function() {
		 setTimeout(function(){ fnAspect(); }, 5000);

    });


</script>

<h:body styleClass="body-color">
	<h:form id="formAspect" style="display:none">
		<input type="hidden" name="hiddenWidth" value="#{sessionBean.width}" />
  		<input type="hidden" name="hiddenHeight" value="#{sessionBean.height}" />
  		<h:commandButton id="btnAspect" action="#{sessionBean.submitAspect}">
  		  	<f:ajax execute="@this"  render="@this" />
  		</h:commandButton>
  </h:form>


  <f:facet name="last">
    <h:outputStylesheet library="css" name="style.css" />
  </f:facet>

  		<p:idleMonitor id="idleMonitor" timeout="#{sessionBean.maxInactiveInterval}" onidle="PF('sesionDialog').show()">
        </p:idleMonitor>

        <p:dialog id="sesionDialog" widgetVar="sesionDialog"
                   responsive="true" width="400" height="200" showHeader="false" resizable="false" modal="true">
            <div class="session-cont">
                <p class="text-justify">#{msg['warning.sesion']} </p>
                <p:link outcome="/index" value="#{msg['botones.inicio']}" styleClass="btn-session"></p:link>
            </div>
  		</p:dialog>
    <!--<div style="height: fit-content;width: 100% !important;">

        <div id="cabecera" style="height: 95px">
            <ui:include src="./header.xhtml"/>
        </div>

        <div id="work" class="flex-grow-1 margin-top-10" style="overflow: auto;">
            <h2>#{msg[sessionBean.literalTituloPantalla]}</h2>
            <ui:insert name="content" />
        </div>

        <div id="footer" style="height: 60px">
            <ui:include src="./footer.xhtml" />
        </div>

    </div>-->

    <p:outputPanel style="display: flex; flex-direction: column; height: 100%; width: 100%;">

        <p:outputPanel id="cabecera" style="height: 95px; width: 100%;">
            <ui:include src="./header.xhtml" />
        </p:outputPanel>

        <p:outputPanel id="work" style="flex-grow: 1; margin-top: 10px; overflow: auto;">
            <h2>#{msg[sessionBean.literalTituloPantalla]}</h2>
            <ui:insert name="content" />
        </p:outputPanel>

        <p:outputPanel id="footer" style="height: 60px; width: 100%;">
            <ui:include src="./footer.xhtml" />
        </p:outputPanel>

    </p:outputPanel>

    <!--
  <p:layout fullPage="true" >
    <p:layoutUnit id="header" position="north" size="95" styleClass="noPadding sin-bordes">
      <ui:include src="./header.xhtml"/>
    </p:layoutUnit>

    <p:layoutUnit id="work" position="center" header="#{msg[sessionBean.literalTituloPantalla]}" styleClass="margin-top-10">
      <ui:insert name="content" />
    </p:layoutUnit>

    <p:layoutUnit id="footer" position="south" size="60">
      <ui:include src="./footer.xhtml" />
    </p:layoutUnit>
  </p:layout> -->


  <!-- Inclusion popups genericos -->
  <h:form id="formPopUps">
    <ui:include src="../common/popups.xhtml" />
  </h:form>

</h:body>


    <!-- Para que elementos con global=true mostraran icono cargando (commandbutton, events, ...)-->
    <p:ajaxStatus id="startAjax" onstart="PF('loading').show();" onsuccess="PF('loading').hide();"  />


</f:view>

</html>
