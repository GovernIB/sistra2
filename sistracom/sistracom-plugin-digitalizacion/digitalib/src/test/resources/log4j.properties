# Configuración de nivel de log para la aplicación
log4j.rootLogger=DEBUG, stdout

# Salida de consola
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n

# Configuración para capturar logs de comunicación HTTP
log4j.logger.org.apache.http=DEBUG
log4j.logger.org.apache.http.wire=DEBUG
log4j.logger.org.apache.http.headers=DEBUG
log4j.logger.org.springframework.web.client.RestTemplate=DEBUG
log4j.logger.org.springframework.http.client=DEBUG
